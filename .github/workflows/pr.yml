name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/pr-gate.yml@production
    with:
      install_command: sudo apt-get update -qq && sudo apt-get install -y fpc
      build_command: bash build.sh
      check_release_tag: true
      release_branch: release/
